version: "3.7"

services:
  redis:
    container_name: nest_finder_api_service_redis
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  redis-commander:
    container_name: nest_finder_api_service_redis_commander
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:${REDIS_PORT:-6379}"
    ports:
      - "${REDIS_UI_PORT:-8081}:8081"
    depends_on:
      - redis
    networks:
      - app-network

  nest_finder_api_service_database:
    container_name: nest_finder_api_service_database
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_LOCAL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
      interval: 5s
    networks:
      - app-network

  phpmyadmin:
    container_name: nest_finder_api_service_phpmyadmin
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: nest_finder_api_service_database
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      - nest_finder_api_service_database
    networks:
      - app-network

  nest_finder_api_service:
    container_name: nest_finder_api_service
    image: nestfinderapiservice
    build:
      context: .
      dockerfile: Dockerfile
      target: ${NODE_ENV:-development}
      args:
        APP_ENV: ${APP_ENV:-development}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_ENV: ${APP_ENV:-development}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}

      DB_HOST: ${DB_HOST:-nest_finder_api_service_database}
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_password}
      DB_DATABASE: ${MYSQL_DATABASE:-app_db}

      API_PORT: ${API_PORT:-3000}
      DOMAIN: ${DOMAIN:-http://localhost}
    volumes:
      - ./:/usr/src/app:delegated
      - node_modules:/usr/src/app/node_modules
    command: >
      sh -c 'if [ "$NODE_ENV" = "production" ];
      then yarn start;
      else yarn dev;
      fi'
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - redis
      - nest_finder_api_service_database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  port_forwarding:
    container_name: nest_finder_api_service_port_forwarding
    image: nginx
    ports:
      - "${API_PORT:-3000}:80"
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - nest_finder_api_service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data:
  db_data:
  node_modules:
